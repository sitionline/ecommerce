<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ecommerce Suite · Sitionline</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #09090b;
  --bg2: #111113;
  --card: #18181b;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #fafafa;
  --muted: #71717a;
  --muted2: #52525b;
  --accent: #e4e4e7;
  --font: 'Outfit', sans-serif;
  --mono: 'JetBrains Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
}

/* GRAIN */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)' opacity='0.035'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
}

/* LAYOUT */
.shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
  position: relative;
}

/* SUBTLE GRID BG */
.shell::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}

/* VIGNETTE */
.shell::after {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
  pointer-events: none;
}

.content {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 480px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* LOGO MARK */
.logomark {
  width: 52px;
  height: 52px;
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 24px;
  animation: fadeDown 0.5s ease both;
}
.logomark svg {
  width: 24px;
  height: 24px;
}

/* HEADING */
.heading {
  text-align: center;
  margin-bottom: 8px;
  animation: fadeDown 0.5s 0.05s ease both;
}
.heading h1 {
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -0.5px;
  color: var(--text);
  margin-bottom: 6px;
}
.heading p {
  font-size: 13px;
  color: var(--muted);
  font-family: var(--mono);
  font-weight: 400;
  letter-spacing: 0.3px;
}

/* DIVIDER */
.divider {
  width: 100%;
  height: 1px;
  background: var(--border);
  margin: 28px 0;
  animation: fadeIn 0.4s 0.1s ease both;
}

/* SECTION LABEL */
.section-label {
  width: 100%;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted2);
  margin-bottom: 12px;
  animation: fadeIn 0.4s 0.15s ease both;
}

/* APP GRID */
.app-grid {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 10px;
}

/* APP TILE */
.app-tile {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px 18px;
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: border-color 0.2s, background 0.2s, transform 0.15s;
  position: relative;
  overflow: hidden;
  cursor: pointer;
}
.app-tile:nth-child(1) { animation: fadeUp 0.4s 0.2s ease both; }
.app-tile:nth-child(2) { animation: fadeUp 0.4s 0.25s ease both; }
.app-tile:nth-child(3) { animation: fadeUp 0.4s 0.3s ease both; }
.app-tile:nth-child(4) { animation: fadeUp 0.4s 0.35s ease both; }

.app-tile::before {
  content: '';
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 0.2s;
}
.app-tile:hover {
  border-color: var(--border2);
  background: #1c1c1f;
  transform: translateY(-2px);
}
.app-tile:hover::before { opacity: 1; }
.app-tile:active { transform: translateY(0); }

/* COLOR ACCENTS per tile */
.app-tile[data-color="violet"]::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, #8b5cf6, #6d28d9);
  border-radius: 14px 14px 0 0;
}
.app-tile[data-color="emerald"]::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, #10b981, #059669);
  border-radius: 14px 14px 0 0;
}
.app-tile[data-color="amber"]::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, #f59e0b, #d97706);
  border-radius: 14px 14px 0 0;
}
.app-tile[data-color="sky"]::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, #0ea5e9, #0284c7);
  border-radius: 14px 14px 0 0;
}

.tile-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}
.tile-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.tile-icon svg { width: 18px; height: 18px; }

.app-tile[data-color="violet"] .tile-icon { background: rgba(139,92,246,0.12); }
.app-tile[data-color="violet"] .tile-icon svg { stroke: #8b5cf6; }
.app-tile[data-color="emerald"] .tile-icon { background: rgba(16,185,129,0.12); }
.app-tile[data-color="emerald"] .tile-icon svg { stroke: #10b981; }
.app-tile[data-color="amber"] .tile-icon { background: rgba(245,158,11,0.12); }
.app-tile[data-color="amber"] .tile-icon svg { stroke: #f59e0b; }
.app-tile[data-color="sky"] .tile-icon { background: rgba(14,165,233,0.12); }
.app-tile[data-color="sky"] .tile-icon svg { stroke: #0ea5e9; }

.tile-arrow {
  color: var(--muted2);
  font-size: 16px;
  transition: color 0.2s, transform 0.2s;
  line-height: 1;
  margin-top: 2px;
}
.app-tile:hover .tile-arrow {
  color: var(--muted);
  transform: translate(2px, -2px);
}

.tile-bottom {}
.tile-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 3px;
  letter-spacing: -0.1px;
}
.tile-desc {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.4;
}

/* STATUS BADGE */
.tile-status {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 9px;
  font-weight: 500;
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 3px 7px;
  border-radius: 99px;
  margin-top: 8px;
}
.tile-status.active {
  background: rgba(16,185,129,0.08);
  color: #10b981;
  border: 1px solid rgba(16,185,129,0.2);
}
.tile-status.soon {
  background: rgba(113,113,122,0.08);
  color: var(--muted);
  border: 1px solid var(--border);
}
.tile-status-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
}
.tile-status.active .tile-status-dot {
  animation: blink 2s ease-in-out infinite;
}

/* ADD TILE */
.add-tile {
  background: transparent;
  border: 1px dashed var(--border2);
  border-radius: 14px;
  padding: 20px 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: default;
  opacity: 0.5;
  animation: fadeUp 0.4s 0.35s ease both;
}
.add-tile-icon {
  width: 28px;
  height: 28px;
  border: 1px solid var(--border2);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: var(--muted2);
}
.add-tile-text {
  font-size: 11px;
  color: var(--muted2);
  text-align: center;
  line-height: 1.4;
}

/* FOOTER */
.footer {
  margin-top: 32px;
  text-align: center;
  animation: fadeIn 0.4s 0.4s ease both;
}
.footer-url {
  font-size: 11px;
  font-family: var(--mono);
  color: var(--muted2);
  letter-spacing: 0.3px;
}
.footer-copy {
  font-size: 10px;
  color: var(--muted2);
  margin-top: 4px;
  opacity: 0.6;
}

/* ANIMATIONS */
@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-10px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.3; }
}

/* MOBILE */
@media (max-width: 420px) {
  .app-grid { grid-template-columns: 1fr; }
  .heading h1 { font-size: 22px; }
  .shell { padding: 32px 16px; }
}
</style>
</head>
<body>
<div class="shell">
  <div class="content">

    <!-- LOGO -->
    <div class="logomark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#e4e4e7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </div>

    <!-- HEADING -->
    <div class="heading">
      <h1>Ecommerce Suite</h1>
      <p>sitionline.github.io/ecommerce</p>
    </div>

    <div class="divider"></div>

    <!-- APPS -->
    <div class="section-label">Aplicaciones</div>

    <div class="app-grid">

      <!-- INVENTARIO -->
      <a class="app-tile" data-color="violet" href="./inventario/">
        <div class="tile-top">
          <div class="tile-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/>
              <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
              <line x1="12" y1="22.08" x2="12" y2="12"/>
            </svg>
          </div>
          <span class="tile-arrow">↗</span>
        </div>
        <div class="tile-bottom">
          <div class="tile-name">Inventario</div>
          <div class="tile-desc">Stock, ventas y devoluciones</div>
          <div class="tile-status active">
            <div class="tile-status-dot"></div>
            Activa
          </div>
        </div>
      </a>

      <!-- VALIDACIÓN -->
      <a class="app-tile" data-color="emerald" href="./validacion/">
        <div class="tile-top">
          <div class="tile-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 11l3 3L22 4"/>
              <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
            </svg>
          </div>
          <span class="tile-arrow">↗</span>
        </div>
        <div class="tile-bottom">
          <div class="tile-name">Validación</div>
          <div class="tile-desc">Evaluación de productos aptos</div>
          <div class="tile-status active">
            <div class="tile-status-dot"></div>
            Activa
          </div>
        </div>
      </a>

      <!-- PRÓXIMAMENTE -->
      <div class="add-tile">
        <div class="add-tile-icon">+</div>
        <div class="add-tile-text">Próxima<br>aplicación</div>
      </div>

      <div class="add-tile">
        <div class="add-tile-icon">+</div>
        <div class="add-tile-text">Próxima<br>aplicación</div>
      </div>

    </div>

    <!-- FOOTER -->
    <div class="footer">
      <div class="footer-url">sitionline · 2026</div>
      <div class="footer-copy">Ecommerce Suite v1.0</div>
    </div>

  </div>
</div>
</body>
</html>
